name: Export Patched Source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand current v0.1.11 source bundle
        shell: pwsh
        run: |
          $parts = @(
            "bundle\v0111_part00a.txt",
            "bundle\v0111_part00b.txt",
            "bundle\v0111_part01.txt",
            "bundle\v0111_part02.txt",
            "bundle\v0111_part03.txt",
            "bundle\v0111_part04.txt",
            "bundle\v0111_part05.txt"
          )
          foreach ($p in $parts) {
            if (!(Test-Path $p)) { throw "Missing source part: $p" }
          }
          $b64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("source_bundle.tar.xz", [Convert]::FromBase64String($b64))
          tar -xf source_bundle.tar.xz
          python -m compileall -q app.py launcher.py triaz_groove_builder
          if ($LASTEXITCODE -ne 0) { throw "Current source validation failed." }

      - name: Upload current source
        uses: actions/upload-artifact@v4
        with:
          name: triaz-groove-builder-source-v0.1.11-current
          path: |
            app.py
            launcher.py
            requirements.txt
            VERSION
            README.md
            installer/
            triaz_groove_builder/
          retention-days: 7
