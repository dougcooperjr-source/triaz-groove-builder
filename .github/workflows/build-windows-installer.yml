name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand source bundle
        shell: pwsh
        run: |
          $b64 = (Get-Content "source_bundle.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("source_bundle.tar.xz", [Convert]::FromBase64String($b64))
          tar -xf source_bundle.tar.xz
          if (!(Test-Path "launcher.py")) { throw "Source bundle did not extract correctly." }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build launcher EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name "TRIAZ Groove Builder" launcher.py

      - name: Download private Python bootstrap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe" -OutFile "build/python-3.11.9-amd64.exe"

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\triaz_groove_builder.iss"
          Get-ChildItem artifacts\*.exe | ForEach-Object {
            Get-FileHash $_.FullName -Algorithm SHA256 | Format-List
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRIAZ-Groove-Builder-Windows-Installer
          path: artifacts/*.exe
          if-no-files-found: error
          retention-days: 30
