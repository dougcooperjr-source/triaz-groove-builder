name: Build Windows Installer v0.1.26

on:
  push:
    branches: [v0.1.24-editor-preview-tools]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand source bundle
        shell: pwsh
        run: |
          $parts = @(
            "bundle\v0111_part00a.txt",
            "bundle\v0111_part00b.txt",
            "bundle\v0111_part01.txt",
            "bundle\v0111_part02.txt",
            "bundle\v0111_part03.txt",
            "bundle\v0111_part04.txt",
            "bundle\v0111_part05.txt"
          )
          foreach ($p in $parts) { if (!(Test-Path $p)) { throw "Missing source part: $p" } }
          $b64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("source_bundle.tar.xz", [Convert]::FromBase64String($b64))
          tar -xf source_bundle.tar.xz
          if (!(Test-Path "app.py")) { throw "Source extraction failed." }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply patch chain through v0.1.26
        shell: pwsh
        run: |
          $parts = Get-ChildItem "bundle\v0112_patch_part*.txt" | Sort-Object Name
          if ($parts.Count -ne 3) { throw "Expected 3 v0.1.12 patch parts." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("v0112_patch.tar.xz", [Convert]::FromBase64String($b64))
          tar -xf v0112_patch.tar.xz

          python patches/v0113_editor_patch.py
          if ($LASTEXITCODE -ne 0) { throw "v0.1.13 patch failed." }

          $parts14 = @("bundle\v0114_patch_part00a.txt", "bundle\v0114_patch_part00b.txt")
          $b6414 = ($parts14 | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("v0114_patch.tar.xz", [Convert]::FromBase64String($b6414))
          tar -xf v0114_patch.tar.xz

          $patches = @(
            "patches/v0115_source_match_patch.py",
            "patches/v0116_bpm_rollback_patch.py",
            "patches/v0117_kick_anchor_patch.py",
            "patches/v0118_strict_kick_anchor_patch.py",
            "patches/v0119_loop_brace_patch.py",
            "patches/v0120_free_loop_brace_patch.py",
            "patches/v0121_loop_audition_patch.py",
            "patches/v0122_loop_colors_playhead_patch.py",
            "patches/v0123_phase2_band_grid_patch.py",
            "patches/v0124_editor_preview_tools_patch.py",
            "patches/v0125_overlay_mute_floor_patch.py",
            "patches/v0126_preserve_lane_rate_patch.py"
          )
          foreach ($p in $patches) {
            python $p
            if ($LASTEXITCODE -ne 0) { throw "Patch failed: $p" }
          }

      - name: Validate source
        shell: pwsh
        run: |
          python -m compileall -q app.py launcher.py triaz_groove_builder
          if ($LASTEXITCODE -ne 0) { throw "Python source validation failed." }
          @'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          editor = Path('triaz_groove_builder/editor.py').read_text(encoding='utf-8')
          preview = Path('triaz_groove_builder/preview.py').read_text(encoding='utf-8')
          launcher = Path('launcher.py').read_text(encoding='utf-8')
          installer = Path('installer/triaz_groove_builder.iss').read_text(encoding='utf-8')
          assert 'v0.1.26' in app
          assert 'APP_VERSION = "0.1.26"' in launcher
          assert '#define MyAppVersion "0.1.26"' in installer
          assert 'TRIAZ_Groove_Builder_Setup_0.1.26.exe' in installer
          assert 'from_=-60.0' in editor
          assert 'text="MUTE" if value <= -59.5' in editor
          assert 'Editing preserves the current lane rate.' in editor
          assert editor.count('self._promote_lane_if_exact(') == 0
          assert 'src_gain = 0.0 if float(source_db) <= -59.5' in preview
          assert 'groove_gain = 0.0 if float(groove_db) <= -59.5' in preview
          print('v0.1.26 source validation passed')
          '@ | python -

      - name: Build launcher EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name "TRIAZ Groove Builder" launcher.py
          if (!(Test-Path "dist\TRIAZ Groove Builder.exe")) { throw "Launcher EXE was not created." }

      - name: Download private Python bootstrap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe" -OutFile "build/python-3.11.9-amd64.exe"
          if (!(Test-Path "build\python-3.11.9-amd64.exe")) { throw "Python bootstrap download failed." }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\triaz_groove_builder.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed." }
          $installer = Get-ChildItem artifacts\TRIAZ_Groove_Builder_Setup_0.1.26.exe | Select-Object -First 1
          if (!$installer) { throw "v0.1.26 Setup.exe was not created." }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRIAZ-Groove-Builder-Windows-Installer-0.1.26
          path: artifacts/TRIAZ_Groove_Builder_Setup_0.1.26.exe
          if-no-files-found: error
          retention-days: 30
